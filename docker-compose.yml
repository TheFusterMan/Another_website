version: '3.9'

services:
    web:
        build:
            context: ./
            dockerfile: Dockerfile
        environment:
            - DATABASE_HOST=db
            - DATABASE_PORT=3306
            - DATABASE_NAME=first
            - DATABASE_USER=pozhidaev
            - DATABASE_PASSWORD=msitop
        volumes:
            - ./:/var/www/html
        depends_on:
            - db
        networks:
            custom_network:
                ipv4_address: 172.20.0.22

    db:
        image: mariadb
        environment:
            MYSQL_DATABASE: first
            MYSQL_USER: pozhidaev
            MYSQL_PASSWORD: msitop
            MYSQL_ROOT_PASSWORD: msitop
        volumes:
            - db_data:/var/lib/mysql
        networks:
            custom_network:
                ipv4_address: 172.20.0.23

    open-appsec-agent:
        image: ghcr.io/openappsec/agent:latest
        container_name: open-appsec-agent
        ipc: host
        environment:
            - registered_server=NGINX
            - AGENT_TOKEN=cp-6b2d4172-033a-4c91-8a1c-ca2266fb14d9fcada5d9-230b-4ba2-b42c-f27a2c2afb49
        volumes:
            - ./openappsec/config:/etc/cp/conf
            - ./openappsec/data:/etc/cp/data
            - ./openappsec/logs:/etc/cp/nano_agent
        networks:
            - custom_network

    open-appsec-nginx:
        image: ghcr.io/openappsec/nginx-attachment:latest
        container_name: open-appsec-nginx
        depends_on:
            - web
            - open-appsec-agent
        ipc: host
        ports:
            - "80:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            custom_network:
                ipv4_address: 172.20.0.24

volumes:
    db_data: {}

networks:
    custom_network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16